name: V2 quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/requirements.lock

      - name: Install test dependencies
        run: python -m pip install -r v2/requirements.lock

      - name: Run V2 quality suite
        run: python -m unittest discover -s v2/tests -p 'test_*.py'
